# QiQi 五笔输入法配置文件 (UTF-8 INI 格式)
# 默认用户配置路径: %LOCALAPPDATA%\QiQiIME\config.ini
# 若用户配置不存在，将回退读取 qiqiime.dll 同级目录下的 config.ini

[dictionary]
# 主词库选择:
#   jidian  = 极点五笔 86 核心主词库 (wubi86_jidian.txt，默认，传统盲打首选体验)
#   haifeng = 海峰五笔 86 超大字符集词库 (wubi86_haifeng.txt，含 CJK 扩展 A/B 区罕用字)
#   builtin = 仅使用 DLL 内置精简保底词库
primary = jidian

# 是否叠加加载极点五笔现代扩展词库 (wubi86_jidian_extra.txt，含现代互联网/科技/汽车/生活新词)
enable_jidian_extra = true

# 用户自定义扩展码表路径 (可选，支持绝对路径或相对于 DLL 目录的相对路径)
user_dict =

[engine]
# 候选窗口每页显示的候选词数量 (范围: 1 - 9)
page_size = 5

# 输入满 4 码且无重码时是否自动上屏
auto_commit_4code = true

# 4 码有重码时继续输入第 5 码是否自动将首选词顶上屏
push_commit_5th = true

# 激活输入法时的默认初始模式 (true = 中文五笔模式, false = 英文模式)
default_chinese_mode = true

# 默认是否启用全角字符模式 (false = 半角, true = 全角；运行期可通过 Shift+Space 动态切换)
default_full_width = false

# 默认是否启用中文全角标点 (true = 中文标点, false = 英文半角标点；运行期可通过 Ctrl+. 动态切换)
default_chinese_punct = true

# 是否允许单按 Shift 键切换中英文模式 (Ctrl+Space 始终可用)
shift_toggle_mode = true

# 是否显示桌面浮动状态条 (默认关闭，可通过任务栏右键菜单随时开启)
show_status_bar = false

# 界面语言 (UI Language): auto (跟随系统) | zh-CN (简体中文) | en-US (English)
ui_language = auto

[log]
# 日志输出级别: trace | debug | info | warn | error | off
level = info
