name: CI & Lint

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'site/**'
      - 'tests/site/**'
      - 'scripts/site_release.mjs'
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'site/**'
      - 'tests/site/**'
      - 'scripts/site_release.mjs'
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build (x64 & x86), Unit Tests & Core Guidelines/GSL Lint
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            build/x64/vcpkg_installed
            build/x86/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build and run unit tests (x64 & x86)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_all.ps1

      - name: Run C++ and PowerShell lint
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          cmake --build build\x64 --config Release --target lint
