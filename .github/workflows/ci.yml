name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'site/**'
      - 'tests/site/**'
      - 'scripts/site_release.mjs'
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'site/**'
      - 'tests/site/**'
      - 'scripts/site_release.mjs'
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build (x64 & x86) and Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            build/x64/vcpkg_installed
            build/x86/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Test nightly report logic
        shell: pwsh
        run: node --test tests\ci\lintreport.test.mjs

      - name: Test lint output handling with fixtures
        shell: pwsh
        run: .\tests\ci\lint.ps1

      - name: Build and run unit tests (x64 & x86)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_all.ps1
