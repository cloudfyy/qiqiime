name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'tests/site/**'
      - 'scripts/site_release.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'tests/site/**'
      - 'scripts/site_release.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check static website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/site/package-lock.json
      - name: Check JavaScript syntax
        run: |
          node --check site/assets/site.js
          node --check site/assets/downloads.js
          node --check site/assets/appearance.js
      - name: Check site links and translations
        run: node --test tests/site/site.test.mjs tests/site/release.test.mjs tests/site/appearance.test.mjs
      - name: Install browser test dependencies
        run: npm ci --prefix tests/site
      - name: Install Chromium
        working-directory: tests/site
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check browser interactions
        working-directory: tests/site
        run: npm run test:browser
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-failures
          path: tests/site/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate latest stable release downloads
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          node scripts/site_release.mjs "$RUNNER_TEMP/latest-release.json" site/release.json
      - name: Upload website only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
